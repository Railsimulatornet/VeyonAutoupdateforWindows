name: PowerShell Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check public project documentation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('CODE_SIGNING_POLICY.md', 'PRIVACY.md', 'SECURITY.md')
          $allowed = @('README.md', 'CODE_SIGNING_POLICY.md', 'PRIVACY.md', 'SECURITY.md', 'TERMS.md')
          foreach ($file in $required) {
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                  throw "Required public document missing: $file"
              }
          }
          foreach ($file in @(Get-ChildItem -Path . -File -Filter '*.md' | Select-Object -ExpandProperty Name)) {
              if ($file -notin $allowed) {
                  throw "Unexpected root documentation: $file"
              }
          }
          if (@(Get-ChildItem -Path .github -File -Filter '*.md').Count -gt 0) {
              throw 'Unexpected repository template document.'
          }
          $readme = Get-Content -LiteralPath README.md -Raw -Encoding UTF8
          foreach ($link in $required) {
              if (-not $readme.Contains("]($link)")) {
                  throw "README does not link to $link"
              }
          }
          $release = Get-Content -LiteralPath release.json -Raw -Encoding UTF8 | ConvertFrom-Json
          foreach ($file in $release.files) {
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                  throw "Release references a missing file: $file"
              }
          }
          Write-Host 'Public project documentation: OK'

      - name: Parse scripts with Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(git ls-files -- '*.ps1')
          if ($LASTEXITCODE -ne 0 -or $files.Count -eq 0) {
              throw 'No tracked PowerShell scripts found.'
          }
          foreach ($file in $files) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Join-Path $env:GITHUB_WORKSPACE $file),
                  [ref]$tokens,
                  [ref]$parseErrors
              ) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  $parseErrors | ForEach-Object { Write-Error $_.Message }
                  throw "PowerShell parse failed: $file"
              }
              Write-Host "Parsed: $file"
          }

      - name: Test update decisions with simulated system calls
        shell: powershell
        run: ./tests/test_update.ps1

      - name: Test native runtime helpers on Windows
        shell: powershell
        run: ./tests/test_runtime_windows.ps1

      - name: Test permissions, signatures and update activation
        shell: powershell
        run: ./tests/test_security.ps1

      - name: Test signed updater packages through the SYSTEM task
        shell: powershell
        run: ./tests/test_selfupdate_windows.ps1

      - name: Test release manifest and ZIP contracts
        run: python -m unittest discover -s tests -p test_build_release.py -v

      - name: Test local release signing with a disposable key
        shell: powershell
        run: ./tests/test_sign_release.ps1

      - name: Verify complete release packages and packaged-source regressions
        run: python scripts/build_release.py --check --check-setup-launch --output dist

      - name: Validate the unsigned artifacts against the source commit
        shell: powershell
        run: ./scripts/Sign-VeyonRelease.ps1 -AssetDirectory dist -SourceCommit (git rev-parse HEAD) -ValidateOnly

      - name: Install and verify the ZIP and setup EXE on the Windows runner
        shell: powershell
        run: ./tests/test_installation_smoke.ps1 -AssetDirectory dist

      - name: Store tested release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-release-assets
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.manifest
            dist/SHA256SUMS
          if-no-files-found: error

  windows-11-installation:
    needs: parse
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download tested release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-release-assets
          path: downloaded
          skip-decompress: true
          digest-mismatch: error
      - name: Verify extracted packages
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'downloaded/tested-release-assets.zip'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw 'Build archive missing.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath dist -Force
          $manifest = Join-Path dist 'SHA256SUMS'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
              throw 'Missing release checksums.'
          }
          $release = Get-Content -LiteralPath release.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $expectedFiles = @($release.archive, $release.setup, $release.update_archive, $release.manifest)
          $verified = @{}
          foreach ($line in (Get-Content -LiteralPath $manifest -Encoding UTF8)) {
              if ($line -notmatch '^([0-9a-fA-F]{64})  ([A-Za-z0-9._-]+)$') {
                  throw 'Invalid checksum record.'
              }
              $name = $Matches[2]
              if ($verified.ContainsKey($name) -or $name -notin $expectedFiles) {
                  throw 'Unexpected or duplicate release file.'
              }
              $file = Join-Path dist $name
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                  throw 'Release file missing.'
              }
              $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
              if ($actual -ine $Matches[1]) {
                  throw 'Release file checksum mismatch.'
              }
              $verified[$name] = $true
          }
          if ($verified.Count -ne $expectedFiles.Count) {
              throw 'Incomplete release package.'
          }
          $actualFiles = @(Get-ChildItem -LiteralPath dist -File | Select-Object -ExpandProperty Name)
          if ($actualFiles.Count -ne ($expectedFiles.Count + 1)) {
              throw 'Unexpected files in release package.'
          }
          Write-Host 'Build packages and SHA256 checksums verified.'
      - name: Test Windows PowerShell security and runtime compatibility
        shell: powershell
        run: |
          ./tests/test_update.ps1
          ./tests/test_security.ps1
          ./tests/test_runtime_windows.ps1
      - name: Test signed updater packages through the SYSTEM task
        shell: powershell
        run: ./tests/test_selfupdate_windows.ps1
      - name: Install and verify both packages on Windows 11
        shell: powershell
        run: ./tests/test_installation_smoke.ps1 -AssetDirectory dist
