name: PowerShell Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Parse scripts with Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(git ls-files -- '*.ps1')
          if ($LASTEXITCODE -ne 0 -or $files.Count -eq 0) {
              throw 'No tracked PowerShell scripts found.'
          }
          foreach ($file in $files) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Join-Path $env:GITHUB_WORKSPACE $file),
                  [ref]$tokens,
                  [ref]$parseErrors
              ) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  $parseErrors | ForEach-Object { Write-Error $_.Message }
                  throw "PowerShell parse failed: $file"
              }
              Write-Host "Parsed: $file"
          }

      - name: Test update decisions with simulated system calls
        shell: powershell
        run: ./tests/test_update.ps1

      - name: Verify complete release packages and packaged-source regressions
        run: python scripts/build_release.py --check --check-setup-launch --output dist

      - name: Install and verify the ZIP and setup EXE on the Windows runner
        shell: powershell
        run: ./tests/test_installation_smoke.ps1 -AssetDirectory dist

      - name: Store tested release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-release-assets
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS
          if-no-files-found: error
